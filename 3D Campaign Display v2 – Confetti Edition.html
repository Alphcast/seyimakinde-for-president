<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campaign Display</title>
  <style>
    /* ===== Tokens ===== */
    :root {
      --bg: #f4f7fb;
      --ink: #172033;
      --muted: #596579;
      --accent: #b58a17;
      --bar: rgba(255, 255, 255, .96);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
      overflow-y: auto
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      overscroll-behavior-y: contain
    }

    /* ===== Layout ===== */
    .app {
      position: relative;
      height: 100%;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto
    }

    header {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 14px clamp(12px, 3vw, 32px) 0
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap
    }

    .brand-logo {
      display: block;
      width: clamp(74px, 8vw, 118px);
      height: auto;
      border-radius: 14px;
      border: 2px solid rgba(212, 175, 55, .7);
      background: rgba(255, 255, 255, .04);
      box-shadow: 0 5px 16px rgba(20, 35, 60, .14)
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 4.2vw, 3rem);
      letter-spacing: .06em;
      text-transform: uppercase;
      line-height: 1.1;
      color: #172033;
      text-shadow: none
    }

    h1 .w {
      display: inline-block;
      white-space: pre
    }

    h1 .ch {
      display: inline-block;
      opacity: 0;
      transform: translateY(.6em) rotateX(70deg);
      animation: chIn .8s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--i)*45ms)
    }

    h1 .ch.gold {
      color: var(--accent)
    }

    @keyframes chIn {
      to {
        opacity: 1;
        transform: none
      }
    }

    .sub {
      margin: .4em 0 0;
      color: #258bff;
      font: 700 clamp(1rem, 2.2vw, 1.4rem) system-ui, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      -webkit-text-stroke: 1px #d4af37;
      paint-order: stroke fill;
      animation: subtitleGlow 1.8s ease-in-out infinite
    }

    @keyframes subtitleGlow {
      50% {
        text-shadow: 0 0 6px #fff, 0 0 15px #d4af37, 0 0 25px #d4af37
      }
    }

    .clock {
      font: 600 clamp(1rem, 2.6vw, 1.8rem) ui-monospace, Menlo, Consolas, monospace;
      color: #765400;
      background: #fff;
      border: 1px solid rgba(181, 138, 23, .5);
      border-radius: 8px;
      padding: .35em .7em;
      text-align: right;
      white-space: nowrap
    }

    .clock small {
      display: block;
      font: .55em system-ui, sans-serif;
      color: var(--muted);
      letter-spacing: .1em
    }

    main {
      position: relative;
      min-height: 0;
      background: #f4f7fb
    }

    #stage,
    #fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    #stage {
      display: block;
      touch-action: pan-y
    }

    #fallback {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: stretch;
      gap: clamp(8px, 1.2vw, 16px);
      padding: 58px clamp(10px, 2vw, 24px) 12px;
      overflow: auto;
      background: #f4f7fb
    }

    .gallery-view #stage,
    .no-webgl #stage {
      display: none
    }

    .gallery-view #fallback,
    .no-webgl #fallback {
      display: grid
    }

    .card {
      width: 100%;
      min-width: 0;
      align-self: start;
      background: #fff;
      border: 1px solid #dce3ed;
      border-radius: 14px;
      padding: 8px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(20, 35, 60, .12);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease
    }

    .card .ph {
      position: relative;
      height: min(34vh, 420px);
      overflow: hidden;
      border-radius: 9px;
      background: #e7edf5;
      display: grid;
      place-items: center;
      color: #596579;
      font: 12px system-ui, sans-serif
    }

    .card .ph img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .card .ph:not(.loaded) img {
      display: none
    }

    .card .ph.loaded span {
      display: none
    }

    .card h2 {
      color: #172033;
      font: 700 clamp(.85rem, 1.35vw, 1.1rem)/1.25 system-ui, sans-serif;
      margin: .65em .1em .25em
    }

    .card p {
      margin: 0 0 .55em;
      color: #596579;
      font: .78rem/1.4 system-ui, sans-serif
    }

    .portrait-like {
      min-height: 38px;
      padding: 6px 14px;
      border: 1px solid #d7dfeb;
      border-radius: 999px;
      background: #f7f9fc;
      color: #38445a;
      font: 700 .82rem system-ui, sans-serif;
      cursor: pointer
    }

    .portrait-like:hover,
    .portrait-like:focus-visible {
      border-color: #cc5264;
      outline: 2px solid rgba(204, 82, 100, .18)
    }

    .portrait-like[aria-pressed="true"] {
      border-color: #c4495c;
      background: #fff0f2;
      color: #a3223a
    }

    .live-note {
      position: absolute;
      left: -9999px
    }

    .campaign-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      z-index: 120;
      background: rgba(24, 35, 52, .38);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease
    }

    .campaign-modal.on {
      opacity: 1;
      visibility: visible
    }

    .campaign-panel {
      position: relative;
      width: min(1080px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: linear-gradient(180deg, #fff, #f7f9fc);
      border: 1px solid #dce3ed;
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(20, 35, 60, .25);
      color: #172033
    }

    .campaign-close {
      position: absolute;
      top: 16px;
      right: 16px;
      border: 1px solid #d3dce8;
      background: #fff;
      color: #172033;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 2
    }

    .campaign-close:hover,
    .campaign-close:focus-visible {
      outline: none;
      background: #eef4fb;
      border-color: #b58a17
    }

    .campaign-body {
      padding: 28px clamp(18px, 4vw, 42px) 42px
    }

    .campaign-hero {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 24px;
      align-items: center;
      padding: 18px 0 8px
    }

    .campaign-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid rgba(143, 220, 173, .5);
      border-radius: 999px;
      background: #edf7ef;
      color: #1f6337;
      font: 700 .72rem system-ui, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase
    }

    .campaign-hero h2 {
      margin: 14px 0 6px;
      font-size: clamp(2.3rem, 5vw, 4.2rem);
      line-height: 1.03;
      letter-spacing: .04em
    }

    .campaign-hero h3 {
      margin: 0 0 12px;
      color: #315843;
      font-size: clamp(1.1rem, 2.2vw, 1.6rem);
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .campaign-hero p {
      margin: 0;
      color: #4d5a6d;
      max-width: 58ch;
      line-height: 1.7;
      font-size: 1.02rem
    }

    .campaign-hero-figure {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px
    }

    .campaign-hero-figure img {
      width: min(100%, 360px);
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 18px;
      border: 2px solid rgba(181, 138, 23, .55);
      box-shadow: 0 12px 28px rgba(20, 35, 60, .16)
    }

    .campaign-statement {
      margin: 18px 0 18px;
      padding: 16px 18px;
      border-left: 4px solid #a8e6b3;
      background: #f1f6f2;
      border-radius: 12px;
      color: #243b2c;
      font-size: 1.05rem
    }

    .campaign-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 22px;
      margin-top: 24px
    }

    .campaign-card {
      background: #fff;
      border: 1px solid #dce3ed;
      border-radius: 18px;
      padding: 20px
    }

    .campaign-message h3 {
      margin: 22px 0 8px;
      color: #1f3555;
      font-size: 1.35rem;
      line-height: 1.3
    }

    .campaign-message h4 {
      margin: 12px 0 8px;
      color: #25533a;
      font-size: 1.05rem
    }

    .campaign-message p {
      margin: 0 0 12px;
      color: #3e4a5c;
      line-height: 1.75
    }

    .campaign-message .message-role {
      font-weight: 700;
      color: #315843
    }

    .campaign-message .message-subtitle {
      color: #596579;
      font-style: italic
    }

    .campaign-message .message-signoff {
      font-weight: 700;
      color: #765400
    }

    .campaign-card h4 {
      margin: 0 0 10px;
      color: #25533a;
      font-size: 1rem;
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .campaign-card ul {
      margin: 0;
      padding-left: 1.1rem;
      display: grid;
      gap: 8px;
      color: #3e4a5c;
      line-height: 1.6
    }

    .campaign-slogans {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
      padding: 0;
      margin: 0
    }

    .campaign-slogans li {
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid #dce3ed;
      background: #f3f6fa;
      color: #314056;
      font: 600 .8rem system-ui, sans-serif
    }

    .campaign-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0 8px
    }

    .campaign-actions a,
    .campaign-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(181, 138, 23, .7);
      font: 700 .9rem system-ui, sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease
    }

    .campaign-actions a {
      background: #dff9e9;
      color: #061309
    }

    .campaign-actions button {
      background: #f4f7fb;
      color: #253248
    }

    .campaign-actions a:hover,
    .campaign-actions a:focus-visible,
    .campaign-actions button:hover,
    .campaign-actions button:focus-visible {
      transform: translateY(-1px);
      outline: none
    }

    .campaign-courtesy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 0 18px;
      padding: 10px 18px;
      border: 1px solid #f0d278;
      border-radius: 999px;
      background: linear-gradient(135deg, #f5d77d, #b78b25);
      color: #171208;
      font: 700 .9rem system-ui, sans-serif;
      cursor: pointer;
      animation: courtesyGlow 1.8s ease-in-out infinite
    }

    .campaign-courtesy:hover,
    .campaign-courtesy:focus-visible {
      transform: translateY(-2px);
      outline: 2px solid #fff1bd;
      outline-offset: 3px
    }

    @keyframes courtesyGlow {
      50% {
        box-shadow: 0 0 18px #f5d77d99;
        transform: translateY(-2px)
      }
    }

    .campaign-section {
      margin-top: 28px
    }

    .campaign-section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid #dce3ed;
      padding-bottom: 10px
    }

    .campaign-section-header h3 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.75rem)
    }

    .campaign-section-header span {
      color: #596579;
      font-size: .8rem;
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .achievement-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px
    }

    .achievement-item {
      border: 1px solid #dce3ed;
      border-radius: 16px;
      background: #fff;
      overflow: hidden
    }

    .achievement-item summary {
      list-style: none;
      cursor: pointer;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px
    }

    .achievement-item summary::-webkit-details-marker {
      display: none
    }

    .achievement-item[open] summary {
      border-bottom: 1px solid #dce3ed
    }

    .achievement-name {
      font-weight: 700;
      color: #253248
    }

    .achievement-status {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      background: #edf7ef;
      border: 1px solid #bdddc7;
      font: 700 .72rem system-ui, sans-serif;
      color: #25533a;
      text-transform: uppercase;
      letter-spacing: .08em
    }

    .achievement-meta {
      margin-top: 4px;
      color: #667287;
      font-size: .82rem
    }

    .achievement-body {
      padding: 16px 18px 18px;
      color: #465368;
      line-height: 1.7
    }

    .achievement-body p {
      margin: 0 0 10px
    }

    .achievement-body a {
      color: #17643b
    }

    .timeline {
      position: relative;
      margin: 18px 0 0;
      padding-left: 18px;
      border-left: 2px solid #c7d7ce
    }

    .timeline-item {
      position: relative;
      padding: 0 0 20px 18px
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #72b985;
      border: 2px solid #fff;
      box-shadow: 0 0 0 3px rgba(114, 185, 133, .2)
    }

    .timeline-item strong {
      display: block;
      color: #253248;
      font-size: 1.02rem;
      margin-bottom: 4px
    }

    .timeline-item span {
      display: block;
      color: #667287;
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 4px
    }

    .timeline-item p {
      margin: 0;
      color: #465368;
      line-height: 1.6
    }

    @media (max-width:800px) {

      .campaign-hero,
      .campaign-grid,
      .achievement-list {
        grid-template-columns: 1fr
      }

      .campaign-panel {
        max-height: calc(100dvh - 16px);
        border-radius: 16px
      }

      .campaign-body {
        padding-top: 18px
      }

      .campaign-hero {
        padding-top: 8px
      }
    }

    @media (max-width:640px) {
      .app {
        min-height: 100dvh;
        height: 100dvh
      }

      header {
        gap: 10px;
        padding: 12px 12px 0
      }

      .brand-wrap {
        width: 100%;
        justify-content: space-between;
        align-items: center
      }

      .sub {
        margin-top: 0;
        letter-spacing: .1em
      }

      .clock {
        display: block;
        width: 100%;
        text-align: left
      }

      main {
        padding-bottom: 44px
      }

      #stage,
      #fallback {
        inset: 0 0 54px 0;
        height: calc(100% - 54px)
      }

      .hint {
        top: 8px;
        width: 84%;
        font-size: .56rem;
        line-height: 1.5;
        letter-spacing: .05em
      }

      .controls {
        top: 6px;
        bottom: auto;
        width: calc(100% - 16px);
        max-width: 430px
      }

      .controls button {
        flex: 1 1 calc(50% - 6px);
        min-width: 0;
        padding: .6em .7em
      }

      .campaign-modal {
        padding: 8px
      }

      .campaign-panel {
        width: 100%;
        max-height: 100dvh;
        border-radius: 14px
      }
    }

    @media (max-width:420px) {
      header {
        padding-top: 10px
      }

      h1 {
        font-size: clamp(1.1rem, 7vw, 1.8rem)
      }

      .brand-logo {
        width: clamp(54px, 16vw, 76px)
      }

      .campaign-body {
        padding: 18px 14px 24px
      }

      .campaign-hero {
        gap: 16px
      }

      .campaign-hero h2 {
        font-size: clamp(2rem, 11vw, 2.8rem)
      }

      .campaign-hero h3 {
        letter-spacing: .06em
      }

      .campaign-actions {
        flex-direction: column
      }

      .campaign-actions a,
      .campaign-actions button {
        width: 100%
      }

      .campaign-section-header {
        flex-direction: column;
        align-items: flex-start
      }

      .achievement-list {
        grid-template-columns: 1fr
      }
    }

    /* ===== Ticker ===== */
    .ticker {
      position: relative;
      z-index: 3;
      overflow: hidden;
      background: #fff;
      border-top: 2px solid var(--accent);
      font: 600 clamp(.8rem, 1.8vw, 1.05rem) system-ui, sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .track {
      display: flex;
      width: max-content;
      animation: scroll var(--dur, 40s) linear infinite;
      padding: .8em 0
    }

    .track span {
      padding: 0 2.2rem;
      white-space: nowrap
    }

    .track span::before {
      content: "◆";
      color: var(--accent);
      margin-right: 2.2rem
    }

    .ticker:hover .track {
      animation-play-state: paused
    }

    @keyframes scroll {
      to {
        transform: translateX(-50%)
      }
    }

    /* ===== Reduced motion ===== */
    .reduce h1 .ch {
      animation: none;
      opacity: 1;
      transform: none
    }

    .reduce .track {
      animation: none;
      width: auto;
      flex-wrap: wrap;
      white-space: normal;
      justify-content: center
    }

    .reduce .track span[aria-hidden] {
      display: none
    }

    .reduce .sub {
      animation: none
    }

    .reduce .campaign-courtesy {
      animation: none
    }

    /* ===== v2 ===== */
    .controls {
      position: absolute;
      left: 50%;
      top: 8px;
      bottom: auto;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 96%
    }

    .controls button {
      font: 600 clamp(.7rem, 1.7vw, .85rem) system-ui, sans-serif;
      color: #253248;
      background: rgba(255, 255, 255, .96);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: .55em 1em;
      cursor: pointer;
      min-height: 40px;
      backdrop-filter: blur(6px)
    }

    .controls button:hover,
    .controls button:focus-visible {
      background: #f5e8bd;
      color: #332500;
      outline: none
    }

    .hint {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font: .72rem system-ui, sans-serif;
      color: var(--muted);
      letter-spacing: .08em;
      text-align: center;
      pointer-events: none;
      width: 92%
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    #detail {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 64px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      width: min(92%, 420px);
      background: rgba(255, 255, 255, .98);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      transition: opacity .35s, transform .35s;
      box-shadow: 0 10px 30px rgba(20, 35, 60, .2)
    }

    #detail.on {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto
    }

    #detail h2 {
      margin: 0 0 .2em;
      font-size: 1.5rem
    }

    #detail p {
      margin: .2em 0;
      color: var(--muted);
      font: .95rem system-ui, sans-serif;
      white-space: pre-line
    }

    #detail .lab {
      color: #765400;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 700
    }

    #dClose {
      position: absolute;
      top: 4px;
      right: 8px;
      background: none;
      border: 0;
      color: #253248;
      font-size: 1.6rem;
      cursor: pointer;
      min-width: 40px;
      min-height: 40px
    }

    .paused .track {
      animation-play-state: paused
    }

    .card {
      cursor: pointer;
      transition: transform .25s
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-3px);
      outline: none;
      box-shadow: 0 10px 24px rgba(20, 35, 60, .18)
    }

    .cf {
      position: fixed;
      width: 8px;
      height: 12px;

    const CONFIG = {

      portraits: [
        { id: "adekanmbi", name: "Hon. Abimbola Bimbo Adekanmbi", title: "Gubernatorial Candidate of Oyo State", label: "APM Candidate", image: "Adekanmi.jpg", note: "" },

      clock: { hour12: false, showDate: true },
      scene: {
        maxPixelRatio: 1.75, maxTextureSize: 1024, particleCount: 220,
        focusCycleSeconds: 4.5, parallax: 0.6

      confetti: { piecesPerHover: 45, piecesPerClick: 220, hoverCooldownMs: 700 },
      themes: [{ name: "Gold", metal: "#b58a17", accent: "#b58a17", beam: "#e3c66d", confetti: ["#b58a17", "#ffffff", "#ffe3a3", "#c0392b", "#2e86de"] }]
    };

    /* =====================================================================
       2. UI MODULE — text, heading animation, ticker, clock, fallback
       ===================================================================== */
    const UI = (() => {
      const $ = id => document.getElementById(id);
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      function applyTheme() {
        const r = document.documentElement.style, c = CONFIG.colors;
        r.setProperty("--bg", c.background); r.setProperty("--ink", c.text);
        r.setProperty("--muted", c.muted); r.setProperty("--accent", c.accent);
        document.body.style.background = c.background;
      }
      function heading() {
        const h = $("heading"), words = CONFIG.heading.text.split(" "); let i = 0;
        h.setAttribute("aria-label", CONFIG.heading.text); h.textContent = "";
        words.forEach((w, wi) => {
          const ws = document.createElement("span"); ws.className = "w"; ws.setAttribute("aria-hidden", "true");
          [...w + (wi < words.length - 1 ? " " : "")].forEach(ch => {
            const s = document.createElement("span"); s.className = "ch" + (CONFIG.heading.goldWords.includes(wi + 1) ? " gold" : "");
            s.style.setProperty("--i", i++); s.textContent = ch; ws.appendChild(s);
          });
          h.appendChild(ws);
        });
        $("subheading").textContent = CONFIG.heading.subtitle; document.title = CONFIG.heading.text;
      }
      function ticker() {
        const t = $("track"); t.textContent = "";

      function clock() {
        const tf = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: CONFIG.clock.hour12 });

          const n = new Date();

      }
      function fallback() {
        const f = $("fallback"); f.textContent = "";
        const likeStatus = $("likeStatus");
        const likesKey = "campaign-portrait-likes";

          const saved = JSON.parse(localStorage.getItem(likesKey) || "[]");

          const placeholder = document.createElement("span"); placeholder.textContent = "Photo unavailable"; ph.appendChild(placeholder);
          if (p.image) {

            im.onerror = () => im.remove();

          const t = document.createElement("p"); t.textContent = p.displayLines ? p.displayLines.filter(line => line !== p.name).join(" · ") : p.title + " · " + p.label;
          const like = document.createElement("button"); like.className = "portrait-like"; like.type = "button";

            like.textContent = isLiked ? "♥ Liked" : "♡ Like";
          };
          like.addEventListener("click", event => {
            event.stopPropagation();
            if (likedPortraits.has(p.id)) likedPortraits.delete(p.id);
            else likedPortraits.add(p.id);
            try {
              localStorage.setItem(likesKey, JSON.stringify([...likedPortraits]));
              likeStatus.textContent = "";
            } catch (error) {
              if (likedPortraits.has(p.id)) likedPortraits.delete(p.id);
              else likedPortraits.add(p.id);
              console.error("Could not save portrait like:", error);
              likeStatus.textContent = "Your like could not be saved. Check this browser's storage settings.";

            updateLike();
          });
          updateLike();
          c.append(ph, h, t, like); f.appendChild(c);

          e.style.left = (r.left + Math.random() * r.width) + "px"; e.style.top = (r.top + 10) + "px"; document.body.appendChild(e);

            { duration: 1100 + Math.random() * 900, easing: "cubic-bezier(.2,.6,.4,1)" }).onfinish = () => e.remove();
        }
      }
      function motion() { document.documentElement.classList.toggle("reduce", reduced.matches); }
      function init() { applyTheme(); heading(); ticker(); fallback(); motion(); reduced.addEventListener("change", motion); return clock(); }
      return { init, applyTheme, showDetail, hideDetail, domConfetti, reduced: () => reduced.matches, onMotionChange: fn => reduced.addEventListener("change", fn) };

    const CampaignExperience = (() => {
      const modal = document.getElementById("campaignModal");

      const closeBtn = document.getElementById("campaignClose");

    /* =====================================================================
       3. TEXTURES — load, downscale, placeholder, nameplates
       ===================================================================== */
    const Tex = (() => {
      const max = () => CONFIG.scene.maxTextureSize;
      const make = (w, h) => Object.assign(document.createElement("canvas"), { width: w, height: h });
      function placeholder(p) {
        const c = make(600, 800), g = c.getContext("2d");
        const gr = g.createLinearGradient(0, 0, 600, 800); gr.addColorStop(0, "#2b3040"); gr.addColorStop(1, "#12141c");
        g.fillStyle = gr; g.fillRect(0, 0, 600, 800);
        g.fillStyle = "#4a5166"; g.beginPath(); g.arc(300, 300, 110, 0, 7); g.fill();
        g.beginPath(); g.ellipse(300, 680, 210, 230, 0, Math.PI, 0); g.fill();
        g.fillStyle = "#c9ccd6"; g.font = "600 30px system-ui,sans-serif"; g.textAlign = "center";
        g.fillText("PHOTO PLACEHOLDER", 300, 770);
        return c;
      }
      function load(p) { // resolves to a canvas ≤ maxTextureSize; never rejects
        return new Promise(res => {
          if (!p.image) return res(placeholder(p));
          const im = new Image(); im.crossOrigin = "anonymous";
          im.onload = () => {
            const s = Math.min(1, max() / Math.max(im.naturalWidth, im.naturalHeight));
            const c = make(Math.max(1, im.naturalWidth * s | 0), Math.max(1, im.naturalHeight * s | 0));
            c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c);
          };
          im.onerror = () => { console.warn("Image failed, using placeholder:", p.image); res(placeholder(p)); };
          im.src = p.image;
        });
      }
      function nameplate(p) {
        const c = make(1024, 256), g = c.getContext("2d"), col = CONFIG.colors;
        g.fillStyle = "#0d0f16"; g.fillRect(0, 0, 1024, 256);
        g.strokeStyle = col.metal; g.lineWidth = 6; g.strokeRect(8, 8, 1008, 240);
        g.textAlign = "center"; g.fillStyle = col.text;
        const fit = (t, size, weight, y, color) => { let s = size; g.fillStyle = color; do { g.font = `${weight} ${s}px Georgia,serif`; s -= 2; } while (g.measureText(t).width > 940 && s > 12); g.fillText(t, 512, y); };
        const lines = p.displayLines || [p.name, p.title, p.label.toUpperCase()];
        const sizes = lines.length === 5 ? [32, 48, 30, 30, 30] : lines.length === 4 ? [34, 58, 34, 32] : [66, 40, 32];
        const startY = lines.length === 5 ? 42 : lines.length === 4 ? 59 : 82;
        const spacing = lines.length === 5 ? 46 : lines.length === 4 ? 59 : 68;
        lines.forEach((line, i) => fit(line, sizes[i], i === 0 && lines.length === 3 || i === 1 && lines.length > 3 ? 700 : 500, startY + i * spacing, i === 0 && lines.length === 3 || i === 1 && lines.length > 3 ? col.text : i === lines.length - 1 ? col.accent : col.muted));
        return c;
      }
      return { load, nameplate };
    })();

    /* =====================================================================
       4. SCENE MODULE — Three.js
       ===================================================================== */
    const Scene3D = (() => {
      let rim, hoverLight, hoverIdx = -1, paused = false, lastHover = 0, rc, ray = { x: 0, y: 0 }, onSelect = () => { }, pal = [], CF = { n: 700, mesh: null, d: [], next: 0 }, dum, metalMat, renderer, scene, camera, panels = [], beams = [], particles, raf = 0, running = false,
        clock, pointer = { x: 0, y: 0 }, cam = { x: 0, y: 0 }, intro = 0, disposables = [], canvas, w = 1, h = 1;
      const col = c => new THREE.Color(c);
      const track = o => (disposables.push(o), o);
      const ease = t => 1 - Math.pow(1 - t, 3);
      const getMetal = () => metalMat || (metalMat = track(new THREE.MeshStandardMaterial({ color: col(CONFIG.colors.metal), metalness: 1, roughness: 0.27 })));

      function supported() {
        try { const c = document.createElement("canvas"); return !!(window.THREE && (c.getContext("webgl2") || c.getContext("webgl"))); }
        catch (e) { return false; }
      }

      async function init(cv) {
        canvas = cv;
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setClearColor(col(CONFIG.colors.background));
        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
        canvas.addEventListener("webglcontextlost", e => { e.preventDefault(); stop(); document.documentElement.classList.add("no-webgl"); });

        scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(col(CONFIG.colors.background), 0.035);
        camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
        clock = new THREE.Clock();

        buildStage(); buildLights(); buildBeams(); buildParticles(); buildConfetti();
        await buildPanels();

        resize(); addEventListener("resize", resize);
        addEventListener("pointermove", onPointer, { passive: true });
        rc = new THREE.Raycaster();
        canvas.addEventListener("pointermove", onCanvasMove); canvas.addEventListener("pointerdown", onCanvasDown); canvas.addEventListener("pointerleave", () => setHover(-1));
        document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
        UI.onMotionChange(() => { stop(); start(); });
        addEventListener("pagehide", dispose);
        start();
      }

      function buildStage() {
        const metal = getMetal();
        const dark = track(new THREE.MeshStandardMaterial({ color: col(CONFIG.colors.stage), metalness: 0.5, roughness: 0.45 }));
        const gm = (g) => track(g);
        const stageWidth = Math.max(14, (CONFIG.portraits.length - 1) * 4.2 + 5);
        const floor = new THREE.Mesh(gm(new THREE.BoxGeometry(stageWidth, 0.4, 6)), dark); floor.position.set(0, -2.4, 0); floor.receiveShadow = true; scene.add(floor);
        const trim = new THREE.Mesh(gm(new THREE.BoxGeometry(stageWidth + 0.3, 0.1, 6.3)), metal); trim.position.set(0, -2.17, 0); trim.receiveShadow = true; scene.add(trim);
        const wall = new THREE.Mesh(gm(new THREE.PlaneGeometry(26, 12)), track(new THREE.MeshStandardMaterial({ color: 0x10131c, roughness: 0.9 })));
        wall.position.set(0, 2, -3.2); wall.receiveShadow = true; scene.add(wall);
        [-1, 1].forEach(s => { // layered side columns for depth
          const col1 = new THREE.Mesh(gm(new THREE.BoxGeometry(0.35, 7, 0.6)), metal); col1.position.set(s * (stageWidth / 2 - 0.1), 1, -2.4); col1.castShadow = true; scene.add(col1);
        });
      }

      function buildLights() {
        scene.add(new THREE.HemisphereLight(0x9fb4ff, 0x1a1208, 0.35));
        const key = new THREE.SpotLight(0xfff0d0, 1.6, 40, 0.5, 0.6, 1); key.position.set(0, 9, 8); key.target.position.set(0, 0, 0);
        key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0005; scene.add(key, key.target);
        rim = new THREE.PointLight(col(CONFIG.colors.accent), 0.9, 20); rim.position.set(0, 4, -2.5); scene.add(rim);
        hoverLight = new THREE.PointLight(0xffffff, 0, 14); scene.add(hoverLight);
      }

      function buildBeams() {
        const geo = track(new THREE.ConeGeometry(1.1, 10, 24, 1, true));
        CONFIG.portraits.forEach((_, i) => {
          const x = (i - (CONFIG.portraits.length - 1) / 2) * 4.2;
          const m = track(new THREE.MeshBasicMaterial({ color: col(CONFIG.colors.beam), transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
          const b = new THREE.Mesh(geo, m); b.position.set(x, 3.2, -0.8); b.userData = { base: 0.07, phase: i * 2 }; scene.add(b); beams.push(b);
        });
      }

      function buildParticles() {
        const n = CONFIG.scene.particleCount, pos = new Float32Array(n * 3), seed = new Float32Array(n);
        for (let i = 0; i < n; i++) { pos.set([(Math.random() - .5) * 16, Math.random() * 8 - 2, (Math.random() - .5) * 7], i * 3); seed[i] = Math.random() * 6.28; }
        const g = track(new THREE.BufferGeometry()); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const m = track(new THREE.PointsMaterial({ color: col(CONFIG.colors.beam), size: 0.045, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending }));
        particles = new THREE.Points(g, m); particles.userData = { seed, base: pos.slice() }; scene.add(particles);
      }

      async function buildPanels() {
        const metal = getMetal();
        const back = track(new THREE.MeshStandardMaterial({ color: 0x0b0c12, roughness: 0.8 }));
        const frameGeo = track(new THREE.BoxGeometry(3.3, 4.3, 0.22)), backGeo = track(new THREE.BoxGeometry(3.05, 4.05, 0.12));
        const imgGeo = track(new THREE.PlaneGeometry(2.8, 3.73)), plateGeo = track(new THREE.PlaneGeometry(3.1, 0.775));
        const canv = await Promise.all(CONFIG.portraits.map(Tex.load));
        CONFIG.portraits.forEach((p, i) => {
          const grp = new THREE.Group(), x = (i - (CONFIG.portraits.length - 1) / 2) * 4.2;
          const frame = new THREE.Mesh(frameGeo, metal); frame.castShadow = frame.receiveShadow = true;
          const bk = new THREE.Mesh(backGeo, back); bk.position.z = 0.09; bk.receiveShadow = true;
          const t = track(new THREE.CanvasTexture(canv[i])); t.encoding = THREE.sRGBEncoding;
          t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy()); t.generateMipmaps = true;
          const img = new THREE.Mesh(imgGeo, track(new THREE.MeshStandardMaterial({ map: t, roughness: 0.55, metalness: 0.05 }))); img.position.set(0, 0.07, 0.17);
          const pt = track(new THREE.CanvasTexture(Tex.nameplate(p))); pt.encoding = THREE.sRGBEncoding;
          const plate = new THREE.Mesh(plateGeo, track(new THREE.MeshStandardMaterial({ map: pt, roughness: 0.4, metalness: 0.3 }))); plate.position.set(0, -2.7, 0.2);
          grp.add(frame, bk, img, plate); grp.position.set(x, 0.3, 0); grp.userData = { x, i, focus: 0, plate: pt };
          grp.position.y = -6; scene.add(grp); panels.push(grp);
        });
      }

      function buildConfetti() {
        dum = new THREE.Object3D(); pal = CONFIG.themes[0].confetti.map(col);
        const m = track(new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
        CF.mesh = track(new THREE.InstancedMesh(track(new THREE.PlaneGeometry(0.1, 0.16)), m, CF.n)); CF.mesh.frustumCulled = false;
        dum.scale.setScalar(0); dum.updateMatrix();
        for (let i = 0; i < CF.n; i++) { CF.mesh.setMatrixAt(i, dum.matrix); CF.mesh.setColorAt(i, pal[0]); CF.d.push({ life: 0, on: false }); }
        scene.add(CF.mesh);
      }
      function burst(i, count) {
        if (UI.reduced() || !CF.mesh) return;
        const p = panels[i], R = Math.random;
        for (let k = 0; k < count; k++) {
          const s = CF.next++ % CF.n, c = CF.d[s];
          Object.assign(c, {
            x: p.position.x + (R() - .5) * 3, y: p.position.y + 2.3 + R() * .4, z: 0.4 + R() * .8,
            vx: (R() - .5) * 4.5, vy: 2 + R() * 4.5, vz: (R() - .3) * 2, rx: R() * 6, rz: R() * 6, sx: (R() - .5) * 16, sz: (R() - .5) * 16, life: 2.4 + R() * 1.6
          });
          CF.mesh.setColorAt(s, pal[(R() * pal.length) | 0]);
        }
        CF.mesh.instanceColor.needsUpdate = true;
      }
      function updateConfetti(dt) {
        if (!CF.mesh) return; let any = false;
        for (let i = 0; i < CF.n; i++) {
          const c = CF.d[i];
          if (c.life <= 0) { if (c.on) { dum.position.set(0, 0, 0); dum.scale.setScalar(0); dum.updateMatrix(); CF.mesh.setMatrixAt(i, dum.matrix); c.on = false; any = true; } continue; }
          c.life -= dt; c.vy = Math.max(-3, c.vy - 6 * dt); c.vx *= 1 - .6 * dt; c.vz *= 1 - .6 * dt;
          c.x += c.vx * dt; c.y += c.vy * dt; c.z += c.vz * dt; c.rx += c.sx * dt; c.rz += c.sz * dt;
          if (c.y < -2.15) c.life = Math.min(c.life, .4);
          c.on = any = true; const s = Math.min(1, c.life / .5);
          dum.position.set(c.x, c.y, c.z); dum.rotation.set(c.rx, 0, c.rz);
          dum.scale.set(s, s * (0.4 + 0.6 * Math.abs(Math.cos(c.rx))), s); dum.updateMatrix(); CF.mesh.setMatrixAt(i, dum.matrix);
        }
        if (any) CF.mesh.instanceMatrix.needsUpdate = true;
      }
      function setRay(e) { const r = canvas.getBoundingClientRect(); ray.x = ((e.clientX - r.left) / r.width) * 2 - 1; ray.y = -((e.clientY - r.top) / r.height) * 2 + 1; }
      function pick() {
        rc.setFromCamera(ray, camera); const hits = rc.intersectObjects(panels, true); if (!hits.length) return -1;
        let o = hits[0].object; while (o && o.userData.i === undefined) o = o.parent; return o ? o.userData.i : -1;
      }
      function setHover(i) {
        if (i === hoverIdx) return; hoverIdx = i;
        if (i >= 0) { const n = performance.now(); if (n - lastHover > CONFIG.confetti.hoverCooldownMs) { lastHover = n; burst(i, CONFIG.confetti.piecesPerHover); } }
        if (!running) frame(0, true);
      }
      function onCanvasMove(e) { if (e.pointerType !== "mouse") return; setRay(e); const i = pick(); canvas.style.cursor = i >= 0 ? "pointer" : "default"; setHover(i); }
      function onCanvasDown(e) { setRay(e); const i = pick(); if (i >= 0) select(i); }
      function select(i) { burst(i, CONFIG.confetti.piecesPerClick); onSelect(i); }
      function celebrate() { panels.forEach((_, i) => setTimeout(() => burst(i, CONFIG.confetti.piecesPerClick), i * 180)); }
      function setTheme(th) {
        pal = th.confetti.map(col); getMetal().color.set(th.metal); rim.color.set(th.accent);
        beams.forEach(b => b.material.color.set(th.beam)); particles.material.color.set(th.beam);
        panels.forEach(p => { p.userData.plate.image = Tex.nameplate(CONFIG.portraits[p.userData.i]); p.userData.plate.needsUpdate = true; });
        if (!running) frame(0, true);
      }

      function resize() {
        const el = canvas.parentElement; w = Math.max(1, el.clientWidth); h = Math.max(1, el.clientHeight);
        const small = w < 700;
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, small ? 1.5 : CONFIG.scene.maxPixelRatio));
        renderer.setSize(w, h, false); camera.aspect = w / h;
        const halfW = Math.max(7.4, (CONFIG.portraits.length - 1) * 2.1 + 1.65), fov = camera.fov * Math.PI / 180;
        camera.userData.z = Math.max(10, halfW / (Math.tan(fov / 2) * camera.aspect), 6.2 / Math.tan(fov / 2) / 1.0 * 0.5);
        camera.updateProjectionMatrix(); frame(0, true);
      }
      function onPointer(e) { pointer.x = (e.clientX / innerWidth - .5) * 2; pointer.y = (e.clientY / innerHeight - .5) * 2; }

      function frame(dt, force) {
        const t = clock.elapsedTime, reduce = UI.reduced();
        intro = reduce ? 1 : Math.min(1, intro + dt / 1.8);
        const focusIdx = hoverIdx >= 0 ? hoverIdx : (reduce || paused ? -1 : Math.floor(t / CONFIG.scene.focusCycleSeconds) % panels.length);
        panels.forEach((p, i) => {
          const e = ease(Math.min(1, Math.max(0, intro * 1.6 - i * 0.2)));
          p.userData.focus += ((i === focusIdx ? 1 : 0) - p.userData.focus) * Math.min(1, dt * 3);
          const f = p.userData.focus;
          p.position.y = THREE.MathUtils.lerp(-6, 0.3, e) + (reduce ? 0 : Math.sin(t * .8 + i) * .05);
          p.position.z = f * 0.7; p.scale.setScalar(1 + f * 0.05);
          p.rotation.x += ((hoverIdx === i && !reduce ? -ray.y * 0.08 : 0) - p.rotation.x) * Math.min(1, dt * 8);
          p.rotation.y = reduce ? 0 : Math.sin(t * .4 + i) * .04 + (pointer.x * -0.05);
        });
        const hp = hoverIdx >= 0 ? panels[hoverIdx] : null;
        if (hp) hoverLight.position.set(hp.position.x, hp.position.y + 0.5, 3.5);
        hoverLight.intensity += ((hp ? 1.8 : 0) - hoverLight.intensity) * Math.min(1, dt * 6);
        updateConfetti(dt);
        beams.forEach((b, i) => { b.material.opacity = reduce ? b.userData.base : b.userData.base * (0.7 + 0.5 * Math.sin(t * 1.1 + b.userData.phase)) + (panels[i] ? panels[i].userData.focus * 0.06 : 0); b.rotation.z = reduce ? 0 : Math.sin(t * .5 + b.userData.phase) * .05; });
        if (!reduce) {
          const pa = particles.geometry.attributes.position, b0 = particles.userData.base, sd = particles.userData.seed;
          for (let i = 0; i < sd.length; i++) {
            pa.array[i * 3] = b0[i * 3] + Math.sin(t * .3 + sd[i]) * .3;
            pa.array[i * 3 + 1] = ((b0[i * 3 + 1] + 2 + t * .15 * (0.4 + sd[i] % 1)) % 8) - 2;
          } pa.needsUpdate = true;
        }
        const par = reduce ? 0 : CONFIG.scene.parallax, z = camera.userData.z;
        cam.x += (pointer.x * par - cam.x) * Math.min(1, dt * 2); cam.y += (-pointer.y * par * .5 - cam.y) * Math.min(1, dt * 2);
        const sway = reduce || paused ? 0 : Math.sin(t * .25) * .5;
        camera.position.set(cam.x + sway, 1.4 + cam.y, z); camera.lookAt(0, 0.4, 0);
        renderer.render(scene, camera);
      }

      function loop() { if (!running) return; raf = requestAnimationFrame(loop); frame(Math.min(clock.getDelta(), 0.05)); }
      function start() {
        if (running) return; clock.getDelta();
        if (UI.reduced()) { frame(0, true); return; } // static render only
        running = true; loop();
      }
      function stop() { running = false; cancelAnimationFrame(raf); }
      function dispose() {
        stop(); removeEventListener("resize", resize); removeEventListener("pointermove", onPointer); if (CF.mesh) CF.mesh.dispose();
        disposables.forEach(d => d.dispose && d.dispose()); scene && scene.traverse(o => { if (o.material && o.material.dispose) o.material.dispose(); });
        renderer && renderer.dispose();
      }
      return { supported, init, dispose, select, celebrate, setTheme, hover: setHover, setPaused: v => { paused = v; }, setOnSelect: f => { onSelect = f; } };
    })();

    /* =====================================================================
       5. BOOT
       ===================================================================== */
    (async function boot() {
      UI.init();
      const root = document.documentElement, $ = id => document.getElementById(id);
      CampaignExperience.init();

      CONFIG.portraits.forEach(p => {
        const b = document.createElement("button"); b.className = "sr"; b.textContent = "View profile: " + p.name;
        b.onclick = () => CampaignExperience.open(p.id);
        $("hits").appendChild(b);
      });

      const openCourtesy = () => CampaignExperience.open("courtesy");
      const fullscreen = () => document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen && root.requestFullscreen();
      $("bPause").onclick = openCourtesy; $("bFs").onclick = fullscreen;
      if (!document.fullscreenEnabled) $("bFs").hidden = true;
      addEventListener("keydown", e => {
        if (e.ctrlKey || e.metaKey || e.altKey) return; const k = e.key.toLowerCase();
        if (k === "f") fullscreen(); else if (k === "escape") UI.hideDetail();
        else if (/^[1-9]$/.test(k) && CONFIG.portraits[k - 1]) CampaignExperience.open(CONFIG.portraits[k - 1].id);
      });
    })();
  </script>
