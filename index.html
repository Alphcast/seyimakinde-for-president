<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campaign Display</title>
  <style>
    /* ===== Tokens ===== */
    :root {
      --bg: #07090f;
      --ink: #f5f1e6;
      --muted: #b9b3a3;
      --accent: #d4af37;
      --bar: rgba(7, 9, 15, .82);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    /* ===== Layout ===== */
    .app {
      position: relative;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto
    }

    header {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 14px clamp(12px, 3vw, 32px) 0
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap
    }

    .brand-logo {
      display: block;
      width: clamp(74px, 8vw, 118px);
      height: auto;
      border-radius: 14px;
      border: 2px solid rgba(212, 175, 55, .7);
      background: rgba(255, 255, 255, .04);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .35)
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 4.2vw, 3rem);
      letter-spacing: .06em;
      text-transform: uppercase;
      line-height: 1.1;
      text-shadow: 0 2px 14px #000
    }

    h1 .w {
      display: inline-block;
      white-space: pre
    }

    h1 .ch {
      display: inline-block;
      opacity: 0;
      transform: translateY(.6em) rotateX(70deg);
      animation: chIn .8s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--i)*45ms)
    }

    h1 .ch.gold {
      color: var(--accent)
    }

    @keyframes chIn {
      to {
        opacity: 1;
        transform: none
      }
    }

    .sub {
      margin: .4em 0 0;
      color: var(--muted);
      font: clamp(.7rem, 1.6vw, 1rem) system-ui, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase
    }

    .clock {
      font: 600 clamp(1rem, 2.6vw, 1.8rem) ui-monospace, Menlo, Consolas, monospace;
      color: var(--accent);
      background: var(--bar);
      border: 1px solid rgba(212, 175, 55, .45);
      border-radius: 8px;
      padding: .35em .7em;
      text-align: right;
      white-space: nowrap
    }

    .clock small {
      display: block;
      font: .55em system-ui, sans-serif;
      color: var(--muted);
      letter-spacing: .1em
    }

    main {
      position: relative;
      min-height: 0
    }

    #stage,
    #fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    #stage {
      display: block;
      touch-action: pan-y
    }

    #fallback {
      display: none;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 28px);
      padding: 16px;
      flex-wrap: wrap;
      overflow: auto
    }

    .no-webgl #stage {
      display: none
    }

    .no-webgl #fallback {
      display: flex
    }

    .card {
      width: min(30%, 240px);
      min-width: 130px;
      background: linear-gradient(160deg, #2a2a2e, #111);
      border: 3px solid var(--accent);
      border-radius: 6px;
      padding: 8px;
      text-align: center
    }

    .card .ph {
      aspect-ratio: 3/4;
      background: #1b1d26 center/cover;
      display: grid;
      place-items: center;
      color: var(--muted);
      font: 12px system-ui
    }

    .card h2 {
      font-size: 1rem;
      margin: .6em 0 .1em
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font: .8rem system-ui
    }

    .live-note {
      position: absolute;
      left: -9999px
    }

    .campaign-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      z-index: 120;
      background: rgba(5, 8, 12, .72);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease
    }

    .campaign-modal.on {
      opacity: 1;
      visibility: visible
    }

    .campaign-panel {
      position: relative;
      width: min(1080px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: linear-gradient(180deg, #08110d, #0d1716 25%, #111a1b 100%);
      border: 1px solid rgba(84, 190, 132, .5);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .5)
    }

    .campaign-close {
      position: absolute;
      top: 16px;
      right: 16px;
      border: 1px solid rgba(255, 255, 255, .18);
      background: rgba(11, 16, 15, .7);
      color: var(--ink);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 2
    }

    .campaign-close:hover,
    .campaign-close:focus-visible {
      outline: none;
      background: #0d2e1d;
      border-color: rgba(143, 220, 173, .8)
    }

    .campaign-body {
      padding: 28px clamp(18px, 4vw, 42px) 42px
    }

    .campaign-hero {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 24px;
      align-items: center;
      padding: 18px 0 8px
    }

    .campaign-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid rgba(143, 220, 173, .5);
      border-radius: 999px;
      background: rgba(17, 52, 36, .7);
      color: #dff9e9;
      font: 700 .72rem system-ui, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase
    }

    .campaign-hero h2 {
      margin: 14px 0 6px;
      font-size: clamp(2.3rem, 5vw, 4.2rem);
      line-height: 1.03;
      letter-spacing: .04em
    }

    .campaign-hero h3 {
      margin: 0 0 12px;
      color: #d9f7e6;
      font-size: clamp(1.1rem, 2.2vw, 1.6rem);
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .campaign-hero p {
      margin: 0;
      color: #d3dfe2;
      max-width: 58ch;
      line-height: 1.7;
      font-size: 1.02rem
    }

    .campaign-hero-figure {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px
    }

    .campaign-hero-figure img {
      width: min(100%, 360px);
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 18px;
      border: 2px solid rgba(143, 220, 173, .5);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .35)
    }

    .campaign-statement {
      margin: 18px 0 18px;
      padding: 16px 18px;
      border-left: 4px solid #a8e6b3;
      background: rgba(24, 38, 31, .65);
      border-radius: 12px;
      color: #f0fff3;
      font-size: 1.05rem
    }

    .campaign-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 22px;
      margin-top: 24px
    }

    .campaign-card {
      background: rgba(13, 21, 19, .68);
      border: 1px solid rgba(143, 220, 173, .15);
      border-radius: 18px;
      padding: 20px
    }

    .campaign-card h4 {
      margin: 0 0 10px;
      color: #dff9e9;
      font-size: 1rem;
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .campaign-card ul {
      margin: 0;
      padding-left: 1.1rem;
      display: grid;
      gap: 8px;
      color: #dfe9e7;
      line-height: 1.6
    }

    .campaign-slogans {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
      padding: 0;
      margin: 0
    }

    .campaign-slogans li {
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(201, 216, 218, .18);
      background: rgba(18, 31, 28, .8);
      color: #ebf9ef;
      font: 600 .8rem system-ui, sans-serif
    }

    .campaign-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0 8px
    }

    .campaign-actions a,
    .campaign-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(143, 220, 173, .7);
      font: 700 .9rem system-ui, sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease
    }

    .campaign-actions a {
      background: #dff9e9;
      color: #061309
    }

    .campaign-actions button {
      background: rgba(16, 26, 23, .8);
      color: #edf9f0
    }

    .campaign-actions a:hover,
    .campaign-actions a:focus-visible,
    .campaign-actions button:hover,
    .campaign-actions button:focus-visible {
      transform: translateY(-1px);
      outline: none
    }

    .campaign-section {
      margin-top: 28px
    }

    .campaign-section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(143, 220, 173, .18);
      padding-bottom: 10px
    }

    .campaign-section-header h3 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.75rem)
    }

    .campaign-section-header span {
      color: #bfdbd4;
      font-size: .8rem;
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .achievement-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px
    }

    .achievement-item {
      border: 1px solid rgba(143, 220, 173, .22);
      border-radius: 16px;
      background: rgba(14, 22, 20, .7);
      overflow: hidden
    }

    .achievement-item summary {
      list-style: none;
      cursor: pointer;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px
    }

    .achievement-item summary::-webkit-details-marker {
      display: none
    }

    .achievement-item[open] summary {
      border-bottom: 1px solid rgba(143, 220, 173, .18)
    }

    .achievement-name {
      font-weight: 700;
      color: #edf9f0
    }

    .achievement-status {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(143, 220, 173, .12);
      border: 1px solid rgba(143, 220, 173, .3);
      font: 700 .72rem system-ui, sans-serif;
      color: #dff9e9;
      text-transform: uppercase;
      letter-spacing: .08em
    }

    .achievement-meta {
      margin-top: 4px;
      color: #bfd7d2;
      font-size: .82rem
    }

    .achievement-body {
      padding: 16px 18px 18px;
      color: #dbe8e5;
      line-height: 1.7
    }

    .achievement-body p {
      margin: 0 0 10px
    }

    .achievement-body a {
      color: #b4f3c9
    }

    .timeline {
      position: relative;
      margin: 18px 0 0;
      padding-left: 18px;
      border-left: 2px solid rgba(143, 220, 173, .3)
    }

    .timeline-item {
      position: relative;
      padding: 0 0 20px 18px
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #a8e6b3;
      border: 2px solid #0e1f18;
      box-shadow: 0 0 0 3px rgba(168, 230, 179, .24)
    }

    .timeline-item strong {
      display: block;
      color: #edf9f0;
      font-size: 1.02rem;
      margin-bottom: 4px
    }

    .timeline-item span {
      display: block;
      color: #a8d4cb;
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 4px
    }

    .timeline-item p {
      margin: 0;
      color: #dfe9e7;
      line-height: 1.6
    }

    @media (max-width:800px) {

      .campaign-hero,
      .campaign-grid,
      .achievement-list {
        grid-template-columns: 1fr
      }

      .campaign-panel {
        max-height: 100vh;
        border-radius: 16px
      }

      .campaign-body {
        padding-top: 18px
      }

      .campaign-hero {
        padding-top: 8px
      }
    }

    /* ===== Ticker ===== */
    .ticker {
      position: relative;
      z-index: 3;
      overflow: hidden;
      background: var(--bar);
      border-top: 2px solid var(--accent);
      font: 600 clamp(.8rem, 1.8vw, 1.05rem) system-ui, sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .track {
      display: flex;
      width: max-content;
      animation: scroll var(--dur, 40s) linear infinite;
      padding: .8em 0
    }

    .track span {
      padding: 0 2.2rem;
      white-space: nowrap
    }

    .track span::before {
      content: "◆";
      color: var(--accent);
      margin-right: 2.2rem
    }

    .ticker:hover .track {
      animation-play-state: paused
    }

    @keyframes scroll {
      to {
        transform: translateX(-50%)
      }
    }

    /* ===== Reduced motion ===== */
    .reduce h1 .ch {
      animation: none;
      opacity: 1;
      transform: none
    }

    .reduce .track {
      animation: none;
      width: auto;
      flex-wrap: wrap;
      white-space: normal;
      justify-content: center
    }

    .reduce .track span[aria-hidden] {
      display: none
    }

    /* ===== v2 ===== */
    .controls {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 96%
    }

    .controls button {
      font: 600 clamp(.7rem, 1.7vw, .85rem) system-ui, sans-serif;
      color: var(--ink);
      background: var(--bar);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: .55em 1em;
      cursor: pointer;
      min-height: 40px;
      backdrop-filter: blur(6px)
    }

    .controls button:hover,
    .controls button:focus-visible {
      background: var(--accent);
      color: #000;
      outline: none
    }

    .hint {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font: .72rem system-ui, sans-serif;
      color: var(--muted);
      letter-spacing: .08em;
      text-align: center;
      pointer-events: none;
      width: 92%
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    #detail {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 64px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      width: min(92%, 420px);
      background: rgba(10, 12, 18, .92);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      transition: opacity .35s, transform .35s;
      box-shadow: 0 12px 40px #000a
    }

    #detail.on {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto
    }

    #detail h2 {
      margin: 0 0 .2em;
      font-size: 1.5rem
    }

    #detail p {
      margin: .2em 0;
      color: var(--muted);
      font: .95rem system-ui, sans-serif
    }

    #detail .lab {
      color: var(--accent);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 700
    }

    #dClose {
      position: absolute;
      top: 4px;
      right: 8px;
      background: none;
      border: 0;
      color: var(--ink);
      font-size: 1.6rem;
      cursor: pointer;
      min-width: 40px;
      min-height: 40px
    }

    .paused .track {
      animation-play-state: paused
    }

    .card {
      cursor: pointer;
      transition: transform .25s
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-6px) scale(1.03);
      outline: none
    }

    .cf {
      position: fixed;
      width: 8px;
      height: 12px;
      z-index: 50;
      pointer-events: none;
      border-radius: 1px
    }

    @media (max-width:600px) {
      header {
        flex-direction: column
      }

      .clock {
        align-self: flex-start;
        text-align: left
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <header>
      <div class="brand-wrap">
        <h1 id="heading" aria-label=""></h1>
        <img class="brand-logo" src="APM.jpeg" alt="Allied Peoples Movement logo" />
      </div>
      <p class="sub" id="subheading"></p>
      <div class="clock" role="timer" aria-label="Local time"><span id="time">--:--:--</span><small id="date"></small>
      </div>
    </header>
    <main>
      <canvas id="stage" role="img" aria-label="3D stage showing three portrait panels"></canvas>
      <div id="fallback" aria-label="Portrait panels"></div>
      <p class="hint">Hover or tap a portrait for confetti · keys: C celebrate · T theme · F fullscreen</p>
      <div id="hits"></div>
      <aside id="detail" role="dialog" aria-live="polite" aria-labelledby="dName"><button id="dClose"
          aria-label="Close">×</button>
        <h2 id="dName"></h2>
        <p id="dTitle"></p>
        <p class="lab" id="dLabel"></p>
        <p id="dNote"></p>
      </aside>
      <div class="controls" role="toolbar" aria-label="Display controls"><button id="bCel">🎉 Celebrate</button><button
          id="bPause" aria-label="Open courtesy profile" type="button">🤝 Courtesy</button><button id="bTheme">🎨
          Gold</button><button id="bFs">⛶
          Fullscreen</button></div>
    </main>
    <div class="ticker" aria-label="Information ticker">
      <div class="track" id="track"></div>
    </div>
  </div>

  <div id="campaignModal" class="campaign-modal" aria-hidden="true">
    <div class="campaign-panel" role="dialog" aria-modal="true" aria-labelledby="campaignTitle">
      <button id="campaignClose" class="campaign-close" type="button" aria-label="Close campaign profile">×</button>
      <div id="campaignBody" class="campaign-body"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    /* =====================================================================
       1. CONFIGURATION — edit ONLY this section to change content.
       - portraits[].image : URL / relative path / data: URI. Leave "" or if it
         fails to load, a neutral labelled placeholder is shown. Use only
         photographs you have rights/permission to display.
       - portraits[].note : optional short text shown in the pop-up card (verified facts only).
       - Colors are CSS hex strings. Ticker items are plain text.
       - Nothing here is a claim about real people; replace all placeholders.
       ===================================================================== */
    const CONFIG = {
      heading: { text: "APM", goldWords: [1], subtitle: "Allied Peoples Movement" },
      portraits: [
        { id: "adekanmbi", name: "Hon. Abimbola \"Bimbo\" Adekanmbi", title: "Candidate", label: "APM Candidate", image: "Adekanmi.jpg", note: "" },
        { id: "makinde", name: "ABIODUN SEYI MAKINDE", title: "Candidate", label: "APM Candidate", image: "makinde.jpg", note: "" },
        { id: "odidiomo", name: "Hon. Adedeji Stanley Olajide Odidiomo", title: "Candidate", label: "APM Candidate", image: "Odidiomo.jpg", note: "" }
      ],
      ticker: [
        "SEYI 2027 — Movement for Nigeria",
        "Leadership, Service and Accountability",
        "Public Service. Measurable Results. National Conversation."
      ],
      tickerSecondsPerLoop: 40,
      colors: {
        background: "#07090f", stage: "#14161f", metal: "#d4af37", accent: "#d4af37",
        beam: "#ffe3a3", text: "#f5f1e6", muted: "#b9b3a3"
      },
      clock: { hour12: false, showDate: true },
      scene: {
        maxPixelRatio: 1.75, maxTextureSize: 1024, particleCount: 220,
        focusCycleSeconds: 4.5, parallax: 0.6
      },
      confetti: { piecesPerHover: 45, piecesPerClick: 220, hoverCooldownMs: 700 },
      themes: [   // press T or the Theme button to cycle
        { name: "Gold", metal: "#d4af37", accent: "#d4af37", beam: "#ffe3a3", confetti: ["#d4af37", "#ffffff", "#ffe3a3", "#c0392b", "#2e86de"] },
        { name: "Sapphire", metal: "#9bb7ff", accent: "#6ea8ff", beam: "#bcd7ff", confetti: ["#6ea8ff", "#ffffff", "#bcd7ff", "#f5c542", "#ff6b9d"] },
        { name: "Emerald", metal: "#7fe0b0", accent: "#3ddc97", beam: "#c9ffe6", confetti: ["#3ddc97", "#ffffff", "#c9ffe6", "#f5c542", "#ff7a59"] }
      ]
    };

    /* =====================================================================
       2. UI MODULE — text, heading animation, ticker, clock, fallback
       ===================================================================== */
    const UI = (() => {
      const $ = id => document.getElementById(id);
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      function applyTheme() {
        const r = document.documentElement.style, c = CONFIG.colors;
        r.setProperty("--bg", c.background); r.setProperty("--ink", c.text);
        r.setProperty("--muted", c.muted); r.setProperty("--accent", c.accent);
        document.body.style.background = c.background;
      }
      function heading() {
        const h = $("heading"), words = CONFIG.heading.text.split(" "); let i = 0;
        h.setAttribute("aria-label", CONFIG.heading.text); h.textContent = "";
        words.forEach((w, wi) => {
          const ws = document.createElement("span"); ws.className = "w"; ws.setAttribute("aria-hidden", "true");

      }
      function load(p) { // resolves to a canvas ≤ maxTextureSize; never rejects

      }
      function nameplate(p) {
        const c = make(1024, 256), g = c.getContext("2d"), col = CONFIG.colors;
        g.fillStyle = "#0d0f16"; g.fillRect(0, 0, 1024, 256);
        g.strokeStyle = col.metal; g.lineWidth = 6; g.strokeRect(8, 8, 1008, 240);
        g.textAlign = "center"; g.fillStyle = col.text;
        const fit = (t, size, weight, y, color) => { let s = size; g.fillStyle = color; do { g.font = `${weight} ${s}px Georgia,serif`; s -= 2; } while (g.measureText(t).width > 940 && s > 12); g.fillText(t, 512, y); };
        fit(p.name, 84, 700, 104, col.text); fit(p.title, 46, 400, 160, col.muted); fit(p.label.toUpperCase(), 36, 600, 214, col.accent);

    })();

    /* =====================================================================
       4. SCENE MODULE — Three.js
       ===================================================================== */
    const Scene3D = (() => {
      let rim, hoverLight, hoverIdx = -1, paused = false, lastHover = 0, rc, ray = { x: 0, y: 0 }, onSelect = () => { }, pal = [], CF = { n: 700, mesh: null, d: [], next: 0 }, dum, metalMat, renderer, scene, camera, panels = [], beams = [], particles, raf = 0, running = false,
        clock, pointer = { x: 0, y: 0 }, cam = { x: 0, y: 0 }, intro = 0, disposables = [], canvas, w = 1, h = 1;
      const col = c => new THREE.Color(c);

      const ease = t => 1 - Math.pow(1 - t, 3);
      const getMetal = () => metalMat || (metalMat = track(new THREE.MeshStandardMaterial({ color: col(CONFIG.colors.metal), metalness: 1, roughness: 0.27 })));

      function supported() {
        try { const c = document.createElement("canvas"); return !!(window.THREE && (c.getContext("webgl2") || c.getContext("webgl"))); }
        catch (e) { return false; }
      }

      async function init(cv) {
        canvas = cv;
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setClearColor(col(CONFIG.colors.background));
        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
        canvas.addEventListener("webglcontextlost", e => { e.preventDefault(); stop(); document.documentElement.classList.add("no-webgl"); });

        scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(col(CONFIG.colors.background), 0.035);
        camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
        clock = new THREE.Clock();

        buildStage(); buildLights(); buildBeams(); buildParticles(); buildConfetti();
        await buildPanels();

        resize(); addEventListener("resize", resize);
        addEventListener("pointermove", onPointer, { passive: true });
        rc = new THREE.Raycaster();
        canvas.addEventListener("pointermove", onCanvasMove); canvas.addEventListener("pointerdown", onCanvasDown); canvas.addEventListener("pointerleave", () => setHover(-1));
        document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
        UI.onMotionChange(() => { stop(); start(); });
        addEventListener("pagehide", dispose);
        start();
      }

      function buildStage() {
        const metal = getMetal();
        const dark = track(new THREE.MeshStandardMaterial({ color: col(CONFIG.colors.stage), metalness: 0.5, roughness: 0.45 }));
        const gm = (g) => track(g);
        const floor = new THREE.Mesh(gm(new THREE.BoxGeometry(14, 0.4, 6)), dark); floor.position.set(0, -2.4, 0); floor.receiveShadow = true; scene.add(floor);
        const trim = new THREE.Mesh(gm(new THREE.BoxGeometry(14.3, 0.1, 6.3)), metal); trim.position.set(0, -2.17, 0); trim.receiveShadow = true; scene.add(trim);
        const wall = new THREE.Mesh(gm(new THREE.PlaneGeometry(26, 12)), track(new THREE.MeshStandardMaterial({ color: 0x10131c, roughness: 0.9 })));
        wall.position.set(0, 2, -3.2); wall.receiveShadow = true; scene.add(wall);
        [-1, 1].forEach(s => { // layered side columns for depth
          const col1 = new THREE.Mesh(gm(new THREE.BoxGeometry(0.35, 7, 0.6)), metal); col1.position.set(s * 6.9, 1, -2.4); col1.castShadow = true; scene.add(col1);
        });
      }

      function buildLights() {
        scene.add(new THREE.HemisphereLight(0x9fb4ff, 0x1a1208, 0.35));
        const key = new THREE.SpotLight(0xfff0d0, 1.6, 40, 0.5, 0.6, 1); key.position.set(0, 9, 8); key.target.position.set(0, 0, 0);
        key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0005; scene.add(key, key.target);
        rim = new THREE.PointLight(col(CONFIG.colors.accent), 0.9, 20); rim.position.set(0, 4, -2.5); scene.add(rim);
        hoverLight = new THREE.PointLight(0xffffff, 0, 14); scene.add(hoverLight);
      }

      function buildBeams() {
        const geo = track(new THREE.ConeGeometry(1.1, 10, 24, 1, true));
        [-4.2, 0, 4.2].forEach((x, i) => {
          const m = track(new THREE.MeshBasicMaterial({ color: col(CONFIG.colors.beam), transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
          const b = new THREE.Mesh(geo, m); b.position.set(x, 3.2, -0.8); b.userData = { base: 0.07, phase: i * 2 }; scene.add(b); beams.push(b);
        });
      }

      function buildParticles() {
        const n = CONFIG.scene.particleCount, pos = new Float32Array(n * 3), seed = new Float32Array(n);
        for (let i = 0; i < n; i++) { pos.set([(Math.random() - .5) * 16, Math.random() * 8 - 2, (Math.random() - .5) * 7], i * 3); seed[i] = Math.random() * 6.28; }
        const g = track(new THREE.BufferGeometry()); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const m = track(new THREE.PointsMaterial({ color: col(CONFIG.colors.beam), size: 0.045, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending }));
        particles = new THREE.Points(g, m); particles.userData = { seed, base: pos.slice() }; scene.add(particles);
      }

      async function buildPanels() {
        const metal = getMetal();
        const back = track(new THREE.MeshStandardMaterial({ color: 0x0b0c12, roughness: 0.8 }));
        const frameGeo = track(new THREE.BoxGeometry(3.3, 4.3, 0.22)), backGeo = track(new THREE.BoxGeometry(3.05, 4.05, 0.12));
        const imgGeo = track(new THREE.PlaneGeometry(2.8, 3.73)), plateGeo = track(new THREE.PlaneGeometry(3.1, 0.775));
        const canv = await Promise.all(CONFIG.portraits.map(Tex.load));
        CONFIG.portraits.forEach((p, i) => {
          const grp = new THREE.Group(), x = (i - 1) * 4.2;
          const frame = new THREE.Mesh(frameGeo, metal); frame.castShadow = frame.receiveShadow = true;
          const bk = new THREE.Mesh(backGeo, back); bk.position.z = 0.09; bk.receiveShadow = true;
          const t = track(new THREE.CanvasTexture(canv[i])); t.encoding = THREE.sRGBEncoding;
          t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy()); t.generateMipmaps = true;
          const img = new THREE.Mesh(imgGeo, track(new THREE.MeshStandardMaterial({ map: t, roughness: 0.55, metalness: 0.05 }))); img.position.set(0, 0.07, 0.17);
          const pt = track(new THREE.CanvasTexture(Tex.nameplate(p))); pt.encoding = THREE.sRGBEncoding;
          const plate = new THREE.Mesh(plateGeo, track(new THREE.MeshStandardMaterial({ map: pt, roughness: 0.4, metalness: 0.3 }))); plate.position.set(0, -2.7, 0.2);
          grp.add(frame, bk, img, plate); grp.position.set(x, 0.3, 0); grp.userData = { x, i, focus: 0, plate: pt };
          grp.position.y = -6; scene.add(grp); panels.push(grp);
        });
      }

      function buildConfetti() {
        dum = new THREE.Object3D(); pal = CONFIG.themes[0].confetti.map(col);
        const m = track(new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
        CF.mesh = track(new THREE.InstancedMesh(track(new THREE.PlaneGeometry(0.1, 0.16)), m, CF.n)); CF.mesh.frustumCulled = false;
        dum.scale.setScalar(0); dum.updateMatrix();
        for (let i = 0; i < CF.n; i++) { CF.mesh.setMatrixAt(i, dum.matrix); CF.mesh.setColorAt(i, pal[0]); CF.d.push({ life: 0, on: false }); }
        scene.add(CF.mesh);
      }
      function burst(i, count) {
        if (UI.reduced() || !CF.mesh) return;
        const p = panels[i], R = Math.random;
        for (let k = 0; k < count; k++) {
          const s = CF.next++ % CF.n, c = CF.d[s];
          Object.assign(c, {
            x: p.position.x + (R() - .5) * 3, y: p.position.y + 2.3 + R() * .4, z: 0.4 + R() * .8,
            vx: (R() - .5) * 4.5, vy: 2 + R() * 4.5, vz: (R() - .3) * 2, rx: R() * 6, rz: R() * 6, sx: (R() - .5) * 16, sz: (R() - .5) * 16, life: 2.4 + R() * 1.6

        }

      }
      function updateConfetti(dt) {
        if (!CF.mesh) return; let any = false;
        for (let i = 0; i < CF.n; i++) {
          const c = CF.d[i];
          if (c.life <= 0) { if (c.on) { dum.position.set(0, 0, 0); dum.scale.setScalar(0); dum.updateMatrix(); CF.mesh.setMatrixAt(i, dum.matrix); c.on = false; any = true; } continue; }
          c.life -= dt; c.vy = Math.max(-3, c.vy - 6 * dt); c.vx *= 1 - .6 * dt; c.vz *= 1 - .6 * dt;
          c.x += c.vx * dt; c.y += c.vy * dt; c.z += c.vz * dt; c.rx += c.sx * dt; c.rz += c.sz * dt;
          if (c.y < -2.15) c.life = Math.min(c.life, .4);

          dum.scale.set(s, s * (0.4 + 0.6 * Math.abs(Math.cos(c.rx))), s); dum.updateMatrix(); CF.mesh.setMatrixAt(i, dum.matrix);
        }
        if (any) CF.mesh.instanceMatrix.needsUpdate = true;
      }
      function setRay(e) { const r = canvas.getBoundingClientRect(); ray.x = ((e.clientX - r.left) / r.width) * 2 - 1; ray.y = -((e.clientY - r.top) / r.height) * 2 + 1; }
      function pick() {
        rc.setFromCamera(ray, camera); const hits = rc.intersectObjects(panels, true); if (!hits.length) return -1;
        let o = hits[0].object; while (o && o.userData.i === undefined) o = o.parent; return o ? o.userData.i : -1;
      }
      function setHover(i) {
        if (i === hoverIdx) return; hoverIdx = i;
        if (i >= 0) { const n = performance.now(); if (n - lastHover > CONFIG.confetti.hoverCooldownMs) { lastHover = n; burst(i, CONFIG.confetti.piecesPerHover); } }
        if (!running) frame(0, true);
      }
      function onCanvasMove(e) { if (e.pointerType !== "mouse") return; setRay(e); const i = pick(); canvas.style.cursor = i >= 0 ? "pointer" : "default"; setHover(i); }
      function onCanvasDown(e) { setRay(e); const i = pick(); if (i >= 0) select(i); }
      function select(i) { burst(i, CONFIG.confetti.piecesPerClick); onSelect(i); }
      function celebrate() { panels.forEach((_, i) => setTimeout(() => burst(i, CONFIG.confetti.piecesPerClick), i * 180)); }
      function setTheme(th) {
        pal = th.confetti.map(col); getMetal().color.set(th.metal); rim.color.set(th.accent);
        beams.forEach(b => b.material.color.set(th.beam)); particles.material.color.set(th.beam);
        panels.forEach(p => { p.userData.plate.image = Tex.nameplate(CONFIG.portraits[p.userData.i]); p.userData.plate.needsUpdate = true; });
        if (!running) frame(0, true);
      }

      function resize() {
        const el = canvas.parentElement; w = Math.max(1, el.clientWidth); h = Math.max(1, el.clientHeight);
        const small = w < 700;
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, small ? 1.5 : CONFIG.scene.maxPixelRatio));
        renderer.setSize(w, h, false); camera.aspect = w / h;
        const halfW = 7.4, fov = camera.fov * Math.PI / 180;
        camera.userData.z = Math.max(10, halfW / (Math.tan(fov / 2) * camera.aspect), 6.2 / Math.tan(fov / 2) / 1.0 * 0.5);
        camera.updateProjectionMatrix(); frame(0, true);
      }
      function onPointer(e) { pointer.x = (e.clientX / innerWidth - .5) * 2; pointer.y = (e.clientY / innerHeight - .5) * 2; }

      function frame(dt, force) {
        const t = clock.elapsedTime, reduce = UI.reduced();
        intro = reduce ? 1 : Math.min(1, intro + dt / 1.8);
        const focusIdx = hoverIdx >= 0 ? hoverIdx : (reduce || paused ? -1 : Math.floor(t / CONFIG.scene.focusCycleSeconds) % panels.length);
        panels.forEach((p, i) => {
          const e = ease(Math.min(1, Math.max(0, intro * 1.6 - i * 0.2)));
          p.userData.focus += ((i === focusIdx ? 1 : 0) - p.userData.focus) * Math.min(1, dt * 3);
          const f = p.userData.focus;

        });
        const hp = hoverIdx >= 0 ? panels[hoverIdx] : null;

        hoverLight.intensity += ((hp ? 1.8 : 0) - hoverLight.intensity) * Math.min(1, dt * 6);
        updateConfetti(dt);
        beams.forEach((b, i) => { b.material.opacity = reduce ? b.userData.base : b.userData.base * (0.7 + 0.5 * Math.sin(t * 1.1 + b.userData.phase)) + (panels[i] ? panels[i].userData.focus * 0.06 : 0); b.rotation.z = reduce ? 0 : Math.sin(t * .5 + b.userData.phase) * .05; });
        if (!reduce) {
          const pa = particles.geometry.attributes.position, b0 = particles.userData.base, sd = particles.userData.seed;
          for (let i = 0; i < sd.length; i++) {
            pa.array[i * 3] = b0[i * 3] + Math.sin(t * .3 + sd[i]) * .3;
            pa.array[i * 3 + 1] = ((b0[i * 3 + 1] + 2 + t * .15 * (0.4 + sd[i] % 1)) % 8) - 2;
          } pa.needsUpdate = true;
        }
        const par = reduce ? 0 : CONFIG.scene.parallax, z = camera.userData.z;
        cam.x += (pointer.x * par - cam.x) * Math.min(1, dt * 2); cam.y += (-pointer.y * par * .5 - cam.y) * Math.min(1, dt * 2);
        const sway = reduce || paused ? 0 : Math.sin(t * .25) * .5;
        camera.position.set(cam.x + sway, 1.4 + cam.y, z); camera.lookAt(0, 0.4, 0);
        renderer.render(scene, camera);
      }

      function loop() { if (!running) return; raf = requestAnimationFrame(loop); frame(Math.min(clock.getDelta(), 0.05)); }
      function start() {
        if (running) return; clock.getDelta();
        if (UI.reduced()) { frame(0, true); return; } // static render only
        running = true; loop();
      }
      function stop() { running = false; cancelAnimationFrame(raf); }
      function dispose() {
        stop(); removeEventListener("resize", resize); removeEventListener("pointermove", onPointer); if (CF.mesh) CF.mesh.dispose();
        disposables.forEach(d => d.dispose && d.dispose()); scene && scene.traverse(o => { if (o.material && o.material.dispose) o.material.dispose(); });
        renderer && renderer.dispose();
      }
      return { supported, init, dispose, select, celebrate, setTheme, hover: setHover, setPaused: v => { paused = v; }, setOnSelect: f => { onSelect = f; } };
    })();

    /* =====================================================================
       5. BOOT
       ===================================================================== */
    (async function boot() {
      UI.init();
      const root = document.documentElement, $ = id => document.getElementById(id);
      let webgl = false, themeIdx = 0;
      CampaignExperience.init();
      if (Scene3D.supported()) {
        try {
          await Scene3D.init($("stage")); Scene3D.setOnSelect((idx) => {
            UI.showDetail(idx);
            CampaignExperience.open(CONFIG.portraits[idx].id);
          }); webgl = true;
        }
        catch (err) { console.error("3D init failed, using fallback:", err); Scene3D.dispose(); }
      }
      if (!webgl) root.classList.add("no-webgl");

      // Keyboard-accessible profile buttons (focus = hover, Enter = click)
      CONFIG.portraits.forEach((p, i) => {
        const b = document.createElement("button"); b.className = "sr"; b.textContent = "View profile: " + p.name;
        b.onclick = () => {
          if (webgl) Scene3D.select(i);
          else UI.showDetail(i);
          CampaignExperience.open(p.id);
        };
        b.onfocus = () => webgl && Scene3D.hover(i); b.onblur = () => webgl && Scene3D.hover(-1);
        $("hits").appendChild(b);
      });

      const celebrate = () => webgl ? Scene3D.celebrate() : document.querySelectorAll(".card").forEach(c => UI.domConfetti(c, 30));
      const setTheme = n => {
        themeIdx = n % CONFIG.themes.length; const th = CONFIG.themes[themeIdx];
        Object.assign(CONFIG.colors, { metal: th.metal, accent: th.accent, beam: th.beam });
        UI.applyTheme(); if (webgl) Scene3D.setTheme(th); $("bTheme").textContent = "🎨 " + th.name;
      };
      const openCourtesy = () => CampaignExperience.open("courtesy");
      const fullscreen = () => document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen && root.requestFullscreen();
      $("bCel").onclick = celebrate; $("bTheme").onclick = () => setTheme(themeIdx + 1);
      $("bPause").onclick = openCourtesy; $("bFs").onclick = fullscreen;
      if (!document.fullscreenEnabled) $("bFs").hidden = true;
      addEventListener("keydown", e => {
        if (e.ctrlKey || e.metaKey || e.altKey) return; const k = e.key.toLowerCase();
        if (k === "c") celebrate(); else if (k === "t") setTheme(themeIdx + 1);
        else if (k === "f") fullscreen(); else if (k === "escape") UI.hideDetail();
        else if (/^[1-9]$/.test(k) && CONFIG.portraits[k - 1]) webgl ? Scene3D.select(k - 1) : UI.showDetail(k - 1);
      });
    })();
  </script>
